## 🧠 Convolutional Neural Networks - CNNs

.shadow1[
#### 🤔 Definição
Redes Neurais Convolucionais são algoritmos de Inteligência Artificial baseados em redes neurais multicamadas (*multi-layer neural networks*) que aprendem características relevantes a partir de imagens, sendo capazes de realizar diversas tarefas, como classificação, detecção e segmentação de objetos.
]
&lt;br&gt;&lt;br&gt;

.center[.blue[As CNNs tentam imitar como o cérebro humano opera para reconhecer padrões e características em imagens.]]


---

## 🧠 Convolutional Neural Networks - CNNs

.shadow1[
#### 🤔 Estrutura de CNNs

.font90[
Comumente, uma CNN é composta por 4 partes principais:
- **Camadas convolucionais** (*Convolutional layers*)
- **Função de ativação ReLU** - (*Rectified Linear Unit - ReLU*)
- **Camadas de agrupamento** (*Pooling layers* ou *down-sampling layer* ou *subsampling*)
- **Camadas totalmente conectadas** (*Fully connected layers*)

&lt;br&gt;
]
]

## 🧠 Convolutional Neural Networks - CNNs

.shadow1[
#### 1 - Camadas convolucionais (.black[*Convolutional layers*])
]

--

.shadow4[
.font90[
.center[🤔 .orange[**OPERAÇÃO DE CONVOLUÇÃO?**] .blue[(Entrada * Kernel)]]
- .blue[**Operação matemática**]: consiste na **multiplicação de matrizes**, porém de forma elementar.&lt;br&gt;&lt;br&gt;
- .blue[**Na prática**]: consiste na multiplicação elementar de valores de uma matriz **kernel** (filtros) pelos valores de **pixels de uma imagem** e, em seguida, obteção das **somas dos produtos**. Os filtros são **aplicados à imagem inteira**, deslizando-o da **esquerda para direita** e de **cima para baixo**.&lt;br&gt;&lt;br&gt;
- .blue[**Saída**]: mapa de recursos (*feature map*) ou mapa de ativação (*activation map*). Exibe características específicas que foram detectadas na imagem de entrada.
]
]


---
## 🧠 Convolutional Neural Networks - CNNs

.shadow1[
#### 1 - Camadas convolucionais (.black[*Convolutional layers*])
]

--

.shadow4[
.font90[
.center[🤔 .orange[**KERNELS (OU FILTROS)?**]]

- .blue[**Kernels (Filtros)**]: São pequenas **matrizes quadrada** (MxM) com valores (pesos) aleatórios que **deslizam sobre uma imagem de entrada** durante a operação de convolução.&lt;br&gt;&lt;br&gt;
- .blue[**Aprendizado**]: Os **valores dos kernels são aprendidos** durante o processo de **treinamento** usando retropropagação. Os valores atualizados ajudam a melhor detectar padrões importantes na imagem.&lt;br&gt;&lt;br&gt;
- .blue[**Tamanho e Profundidade**]: Matrizes pequenas (3x3, 5x5 ou 7x7). Profundidade depende do dado de entrada. Por exemplo, se for uma imagem RGB, o **kernel** terá profundidade igual a 3.&lt;br&gt;&lt;br&gt;
- .blue[**Importância**]: Cada **kernel** é projetado para detectar **padrões específicos** na imagem (**curvas, bordas, cantos**, etc.). Portanto, influencia na capacidade de extrair recursos relevantes.
]
]

👉 **1 - Kernels de detecção de borda**

- Foram projetados para detectar bordas em uma imagem. Alguns exemplos são:

✔️ .blue[**Filtro Sobel**]: Usado para encontrar bordas horizontais ou verticais.

✔️ .blue[**Filtro Prewitt**]: semelhante ao Sobel, mas usa uma ponderação diferente na matriz para detectar bordas.

✔️ .blue[**Filtro Laplaciano**]: detecta bordas com base na segunda derivada da imagem, fornecendo uma detecção mais detalhada que inclui bordas diagonais.
&lt;br&gt;&lt;br&gt;

**Explore o site**: [image-kernels](https://setosa.io/ev/image-kernels/)

## 🧠 Convolutional Neural Networks - CNNs

.shadow1[
#### 3 - Camadas de agrupamento (.black[*Pooling layers* ou *down-sampling layer*])
]

--

.shadow4[
.font90[
.center[🤔 .orange[**OPERAÇÃO DE AGRUPAMENTO?**]]
- .blue[**Redução de dimensionalidade**]: técnica de subamostragem usada para reduzir a dimensão espacial dos mapas de recursos, retendo as informações mais relevantes. (.red[Após a operação de convolução!]) &lt;br&gt;&lt;br&gt;
- .blue[**Importância**]: redução do **número de parâmetros treináveis e cálculos** da rede, tornando o modelo mais **rápido e eficiente**. Invariância à translação (.red[extrair características da imagem indenpendente da posição do objeto]. Menos parâmetros ajuda reduzir **overfitting**. &lt;br&gt;&lt;br&gt;
- .blue[**Tipos**]: agrupamento máximo (.red[mais usual!]), médio, global e outras.
- .blue[**Na prática**]: Uma pequena janela é definida (2x2, 3x3). Esta janela se move pelo mapa de recursos (.red[resultado da convolução!]) com um passo (**stride**) definido, criando regiões não sobrepostas. Em cada região, o valor (máximo, médio ou global) se torna o pixel de saída do novo mapa de recursos, com menor dimensão.
]
]

---
